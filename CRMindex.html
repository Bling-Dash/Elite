<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM CS Elite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--card2:#F0F3F7;--hover:#F4F7FA;--tx:#495769;--tx2:#1F2A3B;--mut:#66768C;--bd:#E4E9F0;--bd2:#CCD5E0;--ac:#34AD61;--ac2:#288F4E;--acbg:#DCFAE6;--rk:#F05143;--yl:#F5A60A;--link:#0E8FBA;--neg-bg:#FFE5E3;--neg-fg:#BA291C;--warn-bg:#FFF1C7;--warn-fg:#A16207;--pos-bg:#DCFAE6;--pos-fg:#1D733C;--info-bg:#E0F2FE;--info-fg:#075985;--vio-bg:#EDE9FE;--vio-fg:#5B21B6;--input:#FFFFFF;--r:10px;--sh:0 12px 32px rgba(31,42,59,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161619;--card:#222226;--card2:#2C2C31;--hover:#2C2C31;--tx:#E4E4E7;--tx2:#FFFFFF;--mut:#A1A1AA;--bd:#323238;--bd2:#4A4A52;--ac:#5AC782;--ac2:#34AD61;--acbg:#144728;--link:#41CFFA;--neg-bg:#5C1A1A;--neg-fg:#FFD3CF;--warn-bg:#5A3510;--warn-fg:#FFE8B0;--pos-bg:#174A2A;--pos-fg:#C9F5D8;--info-bg:#0C3A52;--info-fg:#CDEBFA;--vio-bg:#35275F;--vio-fg:#E2DAFF;--input:#2C2C31;--sh:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161619;--card:#222226;--card2:#2C2C31;--hover:#2C2C31;--tx:#E4E4E7;--tx2:#FFFFFF;--mut:#A1A1AA;--bd:#323238;--bd2:#4A4A52;--ac:#5AC782;--ac2:#34AD61;--acbg:#144728;--link:#41CFFA;--neg-bg:#5C1A1A;--neg-fg:#FFD3CF;--warn-bg:#5A3510;--warn-fg:#FFE8B0;--pos-bg:#174A2A;--pos-fg:#C9F5D8;--info-bg:#0C3A52;--info-fg:#CDEBFA;--vio-bg:#35275F;--vio-fg:#E2DAFF;--input:#2C2C31;--sh:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Inter',Arial,Roboto,Helvetica,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pular{position:absolute;left:-999px}.pular:focus{left:12px;top:12px;z-index:50;background:var(--card);padding:6px 10px;border-radius:8px}

/* estrutura */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.lateral{background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.marca{font-weight:700;font-size:17px;color:var(--tx2);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;padding:0 6px}
.marca span{display:inline-block;width:10px;height:22px;border-radius:3px;background:var(--ac)}
.quem{padding:10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--card2)}
.quem label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.quem select{width:100%}
.quem small{display:block;color:var(--mut);margin-top:4px}
nav ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none}
nav a:hover{background:var(--hover)}
nav a[aria-current="page"]{background:var(--acbg);color:var(--pos-fg);font-weight:600}
nav .cont{font-size:11.5px;background:var(--rk);color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.rodape{margin-top:auto;font-size:12px;color:var(--mut);display:grid;gap:6px;padding:0 6px}
.sinc{display:flex;align-items:center;gap:6px}
.sinc i{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}
.sinc.erro i{background:var(--rk)}.sinc.envio i{background:var(--yl)}
main{padding:28px 32px 60px;max-width:1240px;width:100%}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:650;color:var(--tx2);line-height:1.2}
h2{font-size:17px;margin:28px 0 10px;color:var(--tx2);font-weight:650;padding-left:10px;border-left:4px solid var(--ac)}
h3{font-size:14.5px;margin:0 0 8px;color:var(--tx2);font-weight:600}
.lead{color:var(--mut);margin:4px 0 0;max-width:80ch}
.mut{color:var(--mut)}.peq{font-size:12.5px}
.menu-movel{display:none}

/* superfícies */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:650;color:var(--tx2);letter-spacing:-.02em;line-height:1.25}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi small{display:block;font-size:12px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.kpi.clica{cursor:pointer}.kpi.clica:hover{border-color:var(--bd2)}

/* etiquetas */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--card2);color:var(--tx);white-space:nowrap}
.t-red{background:var(--neg-bg);color:var(--neg-fg)}.t-org{background:var(--warn-bg);color:var(--warn-fg)}.t-grn{background:var(--pos-bg);color:var(--pos-fg)}.t-blu{background:var(--info-bg);color:var(--info-fg)}.t-vio{background:var(--vio-bg);color:var(--vio-fg)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* avisos */
.aviso{border-radius:var(--r);padding:10px 14px;margin:8px 0;border:1px solid transparent}
.a-warn{background:var(--warn-bg);color:var(--warn-fg)}.a-err{background:var(--neg-bg);color:var(--neg-fg)}.a-ok{background:var(--pos-bg);color:var(--pos-fg)}.a-info{background:var(--info-bg);color:var(--info-fg)}

/* tabelas */
.tw{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--card2);position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clica{cursor:pointer}tbody tr.clica:hover{background:var(--hover)}
td.num,th.num{text-align:right}
th[data-ord]{cursor:pointer}th[data-ord]:hover{color:var(--tx2)}

/* formulários */
label.campo{display:grid;gap:4px;font-size:12.5px;color:var(--mut)}
label.campo>span{font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--bd2);border-radius:8px;background:var(--input);color:var(--tx)}
textarea{min-height:68px;resize:vertical}
.linha{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.opcoes{display:flex;gap:6px;flex-wrap:wrap}
.opcoes label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--bd2);border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx)}
.opcoes input{accent-color:var(--ac)}
.opcoes label:has(input:checked){border-color:var(--ac);background:var(--acbg);color:var(--pos-fg)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0}
.check input{accent-color:var(--ac);margin-top:3px}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--bd2);background:var(--card);color:var(--tx2);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.btn.perigo{color:var(--neg-fg);border-color:var(--neg-fg)}
.btn.peq{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filtros{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}

/* abas */
.abas{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:18px 0 16px;overflow-x:auto}
.abas button{background:none;border:0;padding:9px 12px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.abas button[aria-selected="true"]{color:var(--tx2);border-bottom-color:var(--ac);font-weight:600}

/* listas de itens */
.item{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px}
.item>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:flex-start}
.item>summary::-webkit-details-marker{display:none}
.item>summary::before{content:'›';color:var(--mut);font-weight:700;transition:transform .15s;display:inline-block;margin-top:-1px}
.item[open]>summary::before{transform:rotate(90deg)}
.item .corpo{padding:0 16px 16px 30px}
.item .tit{font-weight:600;color:var(--tx2)}
.item .sub{font-size:12.5px;color:var(--mut)}
.pos{min-width:22px;color:var(--mut);font-weight:600}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}
.tl .ev{position:relative;padding:4px 0 14px}
.tl .ev::before{content:'';position:absolute;left:-22px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--bd2)}
.tl .ev.interacao::before{border-color:var(--ac)}.tl .ev.marco::before{border-color:var(--link)}.tl .ev.nota::before{border-color:var(--yl)}
.pino{background:var(--info-bg);color:var(--info-fg);border-radius:var(--r);padding:8px 12px;margin:6px 0}
.barra{height:6px;border-radius:99px;background:var(--card2);overflow:hidden}.barra i{display:block;height:100%;background:var(--ac)}
.barra.alerta i{background:var(--yl)}.barra.critico i{background:var(--rk)}
.chart{display:grid;gap:6px}
.chart .l{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.chart .l i{display:block;height:14px;border-radius:4px;background:var(--ac);min-width:2px}
.vazio{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--bd2);border-radius:var(--r)}

/* janela */
dialog{border:1px solid var(--bd);border-radius:14px;padding:0;background:var(--card);color:var(--tx);width:min(640px,94vw);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog header{padding:16px 20px 0;display:flex;justify-content:space-between;gap:10px}
dialog header h3{font-size:16px}
dialog .conteudo{padding:12px 20px 18px;max-height:72vh;overflow:auto}
dialog footer{padding:12px 20px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.fechar{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--mut)}
#avisos{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:60;max-width:min(420px,90vw)}
#avisos .aviso{box-shadow:var(--sh);margin:0}
.carregando{display:grid;place-items:center;min-height:60vh;color:var(--mut)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .app.menu-aberto .lateral{transform:none;box-shadow:var(--sh)}
  .menu-movel{display:inline-flex;margin-bottom:12px}
  main{padding:18px 16px 50px}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="app" id="app">
  <aside class="lateral" id="lateral" aria-label="Menu"></aside>
  <main id="conteudo" tabindex="-1"><div class="carregando">Carregando o CRM…</div></main>
</div>
<dialog id="janela"><form method="dialog" id="janelaForm"><header><h3 id="janelaTitulo"></h3><button class="fechar" value="cancelar" aria-label="Fechar">×</button></header><div class="conteudo" id="janelaCorpo"></div><footer id="janelaRodape"></footer></form></dialog>
<div id="avisos" role="status" aria-live="polite"></div>
<script>
// =====================================================================
// CONFIGURAÇÃO — cole aqui o link do App da Web do Apps Script (termina em /exec).
// O código de acesso NÃO vai aqui: cada pessoa digita uma vez e ele fica salvo no navegador dela.
// Com WEBAPP_URL vazio, o CRM abre em modo demonstração (dados só no seu navegador).
// =====================================================================
const WEBAPP_URL = 'https://script.google.com/a/macros/bling.com.br/s/AKfycbyOpU5Pjadz_x16De8HJE94aYzw_doWXlk6CvZShS5L-EqN9TLyj719sToi69zkW9yi1g/exec';

// ===================== constantes do negócio =====================
// Cargos: os quatro primeiros veem e editam tudo; só a Coordenação concede os três primeiros.
const CARGOS = ['Coordenação', 'Gerente executivo', 'Diretor geral', 'CS Ops', 'CSM', 'Visitante'];
const CARGOS_MASTER = ['Coordenação', 'Gerente executivo', 'Diretor geral', 'CS Ops'];
const CARGOS_SUPERIORES = ['Coordenação', 'Gerente executivo', 'Diretor geral'];
const PERFIS_GESTAO = CARGOS_MASTER;
const TIPOS_CARTEIRA = ['Ongoing', 'Onboarding'];
const IFS = ['IF0', 'IF1', 'IF2', 'IF3', 'IF4', 'IF5'];
const IF_NOME = { IF0: 'Cancelamento concluído', IF1: 'Verbalizou cancelamento', IF2: 'Atritado (risco)', IF3: 'Em recuperação', IF4: 'Saudável', IF5: 'Pronto para expansão' };
const TETO_IF = { IF1: 39, IF2: 59, IF3: 59 };
const IF3_ALERTA = 30, IF3_LIMITE = 40, HS_MIN_IF45 = 60, VALIDADE_EXCECAO = 30, DIAS_TACITA = 2, DIAS_SEM_EFETIVO = 60, TAM_LISTA = 10, TETO_A = 10;
const ESTADOS = ['Crítico', 'Em Atenção', 'Sem Resposta', 'Oportunidade', 'Saudável'];
const MODELOS = ['Escala', 'Híbrido', 'Consultivo', 'Key Account'];
const JORNADAS = ['Onboarding', 'Ongoing'];
const LIMITE_DESCONTO = { Mensal: 20, Semestral: 20, Anual: 25 };
const COR_IF = { IF0: '', IF1: 't-red', IF2: 't-org', IF3: 't-vio', IF4: 't-grn', IF5: 't-blu' };
const COR_ESTADO = { 'Crítico': 't-red', 'Em Atenção': 't-org', 'Sem Resposta': '', 'Oportunidade': 't-blu', 'Saudável': 't-grn', 'Cancelado': '' };

const SCHEMAS = {
  usuarios: ['id', 'nome', 'email', 'perfil', 'ativo', 'carteira', 'solicitado_em'],
  oficiais: ['id_cliente', 'razao_social', 'nome_fantasia', 'cnpj', 'data_entrada_elite', 'data_contratacao_bling', 'plano', 'periodicidade', 'mrr', 'gmv', 'pedidos_periodo', 'faixa_apurada', 'hs_dados', 'hs_data_calculo', 'pedidos_mes', 'importacoes_mes', 'consumo_limite_pct', 'inadimplente', 'dias_atraso', 'valor_atraso', 'data_cancelamento', 'atualizado_em'],
  clientes: ['id_cliente', 'jornada', 'status', 'objetivos', 'faixa_atendimento', 'key_account', 'key_account_origem', 'key_account_justificativa', 'prioridade_abc', 'csm_ongoing', 'csm_onboarding', 'data_atribuicao', 'if_atual', 'if_desde', 'if_motivo', 'if_detalhamento', 'if_pendente', 'if3_inicio', 'excecao_validade', 'gatilho', 'gatilho_descricao', 'gatilho_desde', 'criado_em'],
  contatos: ['id', 'id_cliente', 'nome', 'papel', 'telefone', 'whatsapp', 'email', 'canal_preferido', 'sponsor', 'ativo', 'observacoes', 'confirmado_em'],
  interacoes: ['id', 'id_cliente', 'data', 'tipo', 'canal', 'participantes', 'resultado', 'resumo', 'compromissos', 'relevancia', 'chk_abertura', 'chk_cenario', 'chk_uso', 'chk_riscos', 'chk_acao', 'proxima_tarefa_id', 'registrado_por', 'registrado_em'],
  tarefas: ['id', 'id_cliente', 'tipo', 'descricao', 'responsavel', 'prazo', 'status', 'origem', 'chave_regra', 'evidencia', 'concluida_em', 'criada_por', 'criada_em'],
  if_historico: ['id', 'id_cliente', 'if_anterior', 'if_novo', 'data', 'usuario', 'justificativa', 'evidencia', 'motivo', 'detalhamento', 'origem', 'situacao', 'aprovacao_id'],
  aprovacoes: ['id', 'tipo', 'id_cliente', 'solicitante', 'data_pedido', 'previa', 'decisao', 'aprovador', 'data_decisao', 'comentario', 'dados'],
  retencao: ['id', 'id_cliente', 'aberto_em', 'gatilho', 'causa', 'acoes', 'oferta_tipo', 'oferta_pct', 'oferta_meses', 'oferta_situacao', 'aprovacao_id', 'desfecho', 'desfecho_em', 'decidido_por', 'base_decisao'],
  descontos: ['id', 'id_cliente', 'pct', 'valor_anterior', 'valor_novo', 'inicio', 'fim', 'retencao_id', 'aprovado_por'],
  churn: ['id', 'id_cliente', 'data_cancelamento', 'origem', 'motivo', 'detalhamento', 'mrr_perdido', 'churn_surpresa', 'observacao', 'registrado_por', 'registrado_em'],
  notas: ['id', 'id_cliente', 'tipo', 'tipo_marco', 'data', 'texto', 'fixada', 'autor', 'criada_em'],
  eventos: ['id', 'id_cliente', 'data', 'tipo', 'descricao', 'usuario'],
  lista_semanal: ['id', 'semana', 'csm', 'posicao', 'id_cliente', 'motivo', 'prazo_reacao', 'status', 'motivo_status', 'atualizado_em'],
  notificacoes: ['id', 'usuario', 'data', 'tipo', 'mensagem', 'id_cliente', 'lida', 'chave'],
  atribuicoes: ['id', 'id_cliente', 'papel', 'csm_anterior', 'csm_novo', 'data', 'usuario'],
  hs_historico: ['id', 'id_cliente', 'data', 'hs_dados'],
  auditoria: ['id', 'data', 'usuario', 'tabela', 'registro_id', 'id_cliente', 'campo', 'valor_anterior', 'valor_novo'],
  listas: ['id', 'lista', 'valor', 'pai', 'ativo'],
  cadencias: ['id', 'modelo', 'estado', 'prioridade', 'dias'],
};
const CHAVE = { oficiais: 'id_cliente', clientes: 'id_cliente' };
const SEM_AUDITORIA = new Set(['auditoria', 'notificacoes', 'eventos', 'hs_historico', 'listas', 'cadencias', 'oficiais', 'lista_semanal']);
const chaveDe = t => CHAVE[t] || 'id';

const LISTAS_PADRAO = {
  papel_contato: ['Sponsor', 'Decisor', 'Operacional', 'Financeiro'],
  canal: ['WhatsApp', 'E-mail', 'Telefone', 'Videochamada', 'Presencial'],
  tipo_interacao: ['Reunião', 'Ligação', 'Mensagem', 'E-mail', 'Check-in', 'QBR', 'Kickoff de ongoing', 'Contato de retenção', 'Contato de reversão'],
  resultado_contato: ['Efetivo (cliente respondeu)', 'Sem resposta'],
  relevancia_registro_rapido: ['Risco', 'Decisão', 'Compromisso', 'Oportunidade'],
  tipo_tarefa: ['Contato', 'Check-in', 'Follow-up', 'Mensagem de apresentação', 'Kickoff de ongoing', 'Plano de retenção', 'Reclassificar IF', 'Revisar IF', 'Registrar churn', 'Contato de reversão', 'Outro'],
  tipo_marco: ['Kickoff de ongoing', 'QBR', 'Renovação', 'Expansão', 'Troca de sponsor', 'Mudança de plano', 'Registro de passagem', 'Outro'],
  tipo_oferta: ['Desconto', 'Mudança de plano', 'Condição de pagamento', 'Pausa', 'Outro'],
  desfecho_retencao: ['Em negociação', 'Retido', 'Cancelado'],

const LIMITE_URL = 5500;

function dividirOps(ops) {
  const pequenas = [];
  for (const op of ops) {
    if (tamanho(op) <= LIMITE_URL || !(op.op === 'substituir' || op.op === 'anexar')) { pequenas.push(op); continue; }
    let atual = { op: op.op, t: op.t, rows: [] };
    for (const r of op.rows) {
      if (atual.rows.length && tamanho({ ...atual, rows: [...atual.rows, r] }) > LIMITE_URL) { pequenas.push(atual); atual = { op: 'anexar', t: op.t, rows: [] }; }
      atual.rows.push(r);
    }
    pequenas.push(atual);
  }
  const lotes = []; let lote = [];
  for (const op of pequenas) {
    if (lote.length && tamanho([...lote, op]) > LIMITE_URL) { lotes.push(lote); lote = []; }
    lote.push(op);
  }
  if (lote.length) lotes.push(lote);
  return lotes;
}

}

    if (!SEM_AUDITORIA.has(t)) this.auditar(t, r[k], r.id_cliente || '', '(registro criado)', '', '');
    return r[k];
  }
  atualizar(t, id, mud) {
    const r = obter(t, id); if (!r) throw new ErroRegra(`Registro ${id} não encontrado em ${t}.`);
    const m = {};

      if (!SEM_AUDITORIA.has(t)) this.auditar(t, id, r.id_cliente || '', k, r[k], novo);

    if (r) Object.assign(r, limpo); else DB[t].push({ ...linhaVazia(t), ...limpo });

  }

}

// ----- IF -----
function casoAprovacao(c, ifNovo, critOk) {
  if (c.if_atual === 'IF3' && ifNovo === 'IF3') return 'Novo ciclo de IF3';
  if (c.if_atual === 'IF3' && ifNovo === 'IF4' && !critOk) return 'IF4 sem critérios de recuperação';
  if (['IF4', 'IF5'].includes(ifNovo) && c.jornada === 'Ongoing' && c.hs_num != null && c.hs_num < HS_MIN_IF45) return 'IF4 ou IF5 com HS de dados abaixo de 60';

}
function alterarIF(tx, cid, ifNovo, just, ev, motivo = '', det = '', criterios = []) {
  const c = cliente(cid); exigir(c, 'Cliente não encontrado.');
  exigir(IFS.includes(ifNovo) && ifNovo !== 'IF0', 'Para IF0, registre o cancelamento na aba Retenção e churn.');
  exigir(S(just), 'A justificativa é obrigatória.');
  exigir(S(ev), 'Informe a evidência (interação, ticket ou dado que embasa a mudança).');
  exigir(!sim(c.if_pendente), 'Já existe uma classificação aguardando aprovação.');
  if (['IF1', 'IF2'].includes(ifNovo)) exigir(motivo && det, 'IF1 e IF2 exigem motivo e detalhamento do risco.');
  if (ifNovo === 'IF3') { motivo = motivo || c.if_motivo; det = det || c.if_detalhamento; }
  if (ifNovo === c.if_atual) exigir(ifNovo === 'IF3' && (c.dias_if3 || 0) >= IF3_LIMITE, `O cliente já está em ${ifNovo}.`);
  const critOk = (c.hs_num || 0) >= HS_MIN_IF45 && lista('criterio_recuperacao').every(x => criterios.includes(x));
  const caso = casoAprovacao(c, ifNovo, critOk);
  const dados = { if_anterior: c.if_atual, if_novo: ifNovo, justificativa: just, evidencia: ev, motivo, detalhamento: det, criterios, caso, solicitante: tx.usuario };
  if (caso && exigePrevia(c.prioridade_abc, c.key_account, ifNovo)) {
    const aid = tx.inserir('aprovacoes', { tipo: caso, id_cliente: cid, solicitante: tx.usuario, data_pedido: agora(), previa: 'Sim', decisao: 'Pendente', dados: JSON.stringify(dados) });
    tx.atualizar('clientes', cid, { if_pendente: 'Sim' });
    tx.inserir('if_historico', { id_cliente: cid, if_anterior: c.if_atual, if_novo: ifNovo, data: agora(), usuario: tx.usuario, justificativa: just, evidencia: ev, motivo, detalhamento: det, origem: 'Manual', situacao: 'Pendente de aprovação', aprovacao_id: aid });
    evento(tx, cid, 'IF pendente de aprovação', `${c.if_atual} → ${ifNovo} (${caso}). Mantém ${c.if_atual} até a decisão.`);
    notificarCoord(tx, 'Aprovação pendente', `${c.nome}: ${caso} (${c.if_atual} → ${ifNovo})`, cid);
    return { pendente: true, msg: `${caso}: enviado para aprovação da coordenação. O cliente fica em ${c.if_atual} com a marcação “classificação pendente”.` };
  }
  let aid = '';
  if (caso) aid = tx.inserir('aprovacoes', { tipo: caso, id_cliente: cid, solicitante: tx.usuario, data_pedido: agora(), previa: 'Não', decisao: 'Revisão semanal', dados: JSON.stringify(dados) });
  aplicarIF(tx, cid, c.if_atual, ifNovo, just, ev, motivo, det, 'Manual', aid, caso.includes('HS de dados'));
  return { pendente: false, msg: `IF alterado para ${ifNovo}.` + (caso ? ` Como é um caso de “${caso}”, a decisão entra na revisão semanal da coordenação.` : '') };
}
function aplicarIF(tx, cid, ifAnt, ifNovo, just, ev, motivo, det, origem = 'Manual', aid = '', excecao = false) {
  const h = hoje();
  const m = { if_atual: ifNovo, if_desde: iso(h), if_pendente: '', if3_inicio: ifNovo === 'IF3' ? iso(h) : '', excecao_validade: excecao ? iso(somaDias(h, VALIDADE_EXCECAO)) : '' };
  if (['IF1', 'IF2', 'IF3'].includes(ifNovo)) Object.assign(m, { if_motivo: motivo, if_detalhamento: det });
  else if (['IF4', 'IF5'].includes(ifNovo)) Object.assign(m, { if_motivo: '', if_detalhamento: '' });
  tx.atualizar('clientes', cid, m);
  const pend = aid && DB.if_historico.find(r => r.aprovacao_id === aid && r.situacao === 'Pendente de aprovação');
  if (pend) tx.atualizar('if_historico', pend.id, { situacao: 'Vigente', data: agora() });
  else tx.inserir('if_historico', { id_cliente: cid, if_anterior: ifAnt, if_novo: ifNovo, data: agora(), usuario: tx.usuario, justificativa: just, evidencia: ev, motivo, detalhamento: det, origem, situacao: 'Vigente', aprovacao_id: aid });
  evento(tx, cid, 'Alteração de IF', `${ifAnt} → ${ifNovo}: ${just}`);
  const c = obter('clientes', cid), csm = c.csm_ongoing || c.csm_onboarding, nome = nomeCliente(cid);
  if (ifNovo === 'IF1') {
    notificarCoord(tx, 'Novo IF1', `${nome} verbalizou cancelamento (${motivo}).`, cid);
    inserirNaLista(tx, cid, 'IF1: cliente verbalizou cancelamento', h, true);
    abrirRetencaoSePreciso(tx, cid, 'IF1', csm, h);
  } else if (ifNovo === 'IF2') {
    inserirNaLista(tx, cid, `IF2: atritado (${motivo})`, somaUteis(h, 2));
    abrirRetencaoSePreciso(tx, cid, 'IF2', csm, somaUteis(h, 2));
  } else if (ifNovo === 'IF5') {
    notificar(tx, csm, 'Oportunidade', `${nome} está em IF5: avalie abrir uma oportunidade de expansão.`, cid);
  } else if (ifNovo === 'IF0') {
    DB.tarefas.filter(t => t.id_cliente === cid && t.status === 'Aberta').forEach(t => tx.atualizar('tarefas', t.id, { status: 'Cancelada', evidencia: 'Encerrada pelo IF0', concluida_em: agora() }));
    DB.lista_semanal.filter(l => l.id_cliente === cid && l.status === 'Pendente').forEach(l => tx.atualizar('lista_semanal', l.id, { status: 'Dispensado', motivo_status: 'Cliente cancelado' }));
  }
}
function abrirRetencaoSePreciso(tx, cid, gatilho, csm, prazo) {
  const ab = DB.retencao.filter(r => r.id_cliente === cid && ['', 'Em negociação'].includes(r.desfecho));
  if (ab.length) return ab[ab.length - 1].id;
  const rid = tx.inserir('retencao', { id_cliente: cid, aberto_em: agora(), gatilho });

// ----- aprovações -----
function decidirAprovacao(tx, aid, decisao, coment) {
  const a = obter('aprovacoes', aid); exigir(a, 'Pedido não encontrado.');
  const dados = JSON.parse(a.dados || '{}'), cid = a.id_cliente;
  if (a.previa === 'Não') {
    exigir(['Confirmada', 'Revertida'].includes(decisao), 'Escolha confirmar ou reverter.');
    if (decisao === 'Revertida') {
      exigir(S(coment), 'Para reverter, explique o motivo no comentário.');
      const c = obter('clientes', cid);
      if (dados.if_anterior && c.if_atual === dados.if_novo) aplicarIF(tx, cid, c.if_atual, dados.if_anterior, `Revertido pela coordenação: ${coment}`, `Revisão semanal do pedido`, c.if_motivo, c.if_detalhamento, 'Reversão da coordenação');
      notificar(tx, a.solicitante, 'Decisão revertida', `Coordenação reverteu: ${coment}`, cid);
    }
    tx.atualizar('aprovacoes', aid, { decisao, aprovador: tx.usuario, data_decisao: agora(), comentario: coment });
    return decisao === 'Confirmada' ? 'Decisão confirmada.' : 'Decisão revertida.';
  }
  exigir(a.decisao === 'Pendente', 'Este pedido já foi decidido.');
  if (decisao === 'Recusada') exigir(S(coment), 'Explique o motivo da recusa no comentário.');
  registrarDecisao(tx, a, decisao, coment);
  return decisao === 'Aprovada' ? 'Pedido aprovado.' : 'Pedido recusado.';
}
function registrarDecisao(tx, a, decisao, coment) {
  const dados = JSON.parse(a.dados || '{}'), cid = a.id_cliente, ok = decisao.startsWith('Aprovada');
  tx.atualizar('aprovacoes', a.id, { decisao, aprovador: tx.usuario, data_decisao: agora(), comentario: coment });
  if (a.tipo === 'Desconto acima do limite') {
    tx.atualizar('retencao', dados.retencao_id, { oferta_situacao: decisao });
    if (ok) criarDesconto(tx, cid, dados, tx.usuario);
  } else if (ok) {
    const c = obter('clientes', cid);
    const tx2 = tx; const u = tx.usuario; tx2.usuario = dados.solicitante || u;
    aplicarIF(tx2, cid, c.if_atual, dados.if_novo, dados.justificativa, dados.evidencia, dados.motivo || '', dados.detalhamento || '', 'Manual', a.id, (dados.caso || '').includes('HS de dados'));
    tx2.usuario = u;
  } else {
    tx.atualizar('clientes', cid, { if_pendente: '' });
    DB.if_historico.filter(r => r.aprovacao_id === a.id).forEach(r => tx.atualizar('if_historico', r.id, { situacao: 'Recusada' }));
  }
  evento(tx, cid, 'Decisão da coordenação', `${a.tipo}: ${decisao}. ${coment || ''}`.trim());
  notificar(tx, a.solicitante, ok ? 'Pedido aprovado' : 'Pedido recusado', `${a.tipo}: ${coment || decisao}`, cid);
}
function aprovacoesTacitas(tx, d) {

// ----- carga oficial -----
function importarOficiais(tx, linhas) {

    Object.entries(l).forEach(([k, v]) => { const col = MAPA_METABASE[S(k)] || S(k); if (SCHEMAS.oficiais.includes(col) && v != null && S(v) !== '') r[col] = S(v); });

// ----- automações (idempotentes) -----
function executarAutomacoes(tx) {
  const d = hoje(); const log = [];
  // Cada pessoa roda as automações do que pode editar: CS Ops e superiores, tudo; CSM, a própria carteira
  const u = USUARIO(), master = ehMaster(u);
  if (!usuarioAtivo(u) || ehVisitante(u)) return log;
  const n = master ? aprovacoesTacitas(tx, d) : 0; if (n) log.push(`${n} aprovação(ões) por decurso de prazo`);
  VERSAO++;
  carteira().filter(c => master || podeEditar(u, c)).forEach(c => {
    const cid = c.id_cliente, nome = c.nome, csm = respPadrao(c.csm);
    const canc = data(c.data_cancelamento);
    if (canc && c.if_atual !== 'IF0' && c.status === 'Ativo' && canc <= d) {
      registrarChurn(tx, cid, canc, '', '', '', '', 'Dado oficial');
      criarTarefa(tx, cid, 'Registrar churn', 'Registrar origem e motivo do churn', csm, somaUteis(d, 5), 'Regra: IF0 automático', `churn:${cid}:${iso(canc)}`);
      if (d <= fimDoMes(canc)) { const p = somaUteis(d, 2); criarTarefa(tx, cid, 'Contato de reversão', 'Contato de reversão até o fim do mês', csm, p < fimDoMes(canc) ? p : fimDoMes(canc), 'Regra: IF0 automático', `rev:${cid}:${iso(canc)}`); }
      log.push(`IF0 automático: ${nome}`); return;
    }
    if (c.status === 'Janela de reversão' && canc && d > fimDoMes(canc)) { tx.atualizar('clientes', cid, { status: 'Cancelado' }); evento(tx, cid, 'Janela de reversão encerrada', 'Cliente sai da carteira ativa'); }
    if (c.status !== 'Ativo') return;
    if (c.dias_if3 != null) {
      if (c.dias_if3 >= IF3_ALERTA && notificar(tx, csm, 'IF3 no dia 30', `${nome} está há ${c.dias_if3} dias em IF3. Revise os critérios de recuperação.`, cid, `if3d30:${cid}:${c.if3_inicio}`)) evento(tx, cid, 'Alerta automático', 'IF3 chegou ao dia 30');
      if (c.dias_if3 >= IF3_LIMITE && criarTarefa(tx, cid, 'Reclassificar IF', 'IF3 chegou ao dia 40: reclassificar', csm, somaUteis(d, 3), 'Regra: IF3 dia 40', `if3d40:${cid}:${c.if3_inicio}`)) evento(tx, cid, 'Tarefa automática', 'Reclassificação do IF3 (dia 40)');
    }

    if (['IF4', 'IF5'].includes(c.if_atual) && c.jornada === 'Ongoing' && hs != null && hs < HS_MIN_IF45) {
      let ch = '', desc = '';
      if (val && val < d) { ch = `exc:${cid}:${iso(val)}`; desc = 'Exceção de IF venceu (30 dias): revisar a classificação'; }
      else if (!val) { ch = `hs60:${cid}:${c.hs_data_calculo}`; desc = `HS de dados caiu para ${fnum(hs)}: reclassificar (IF3 ou IF2) ou justificar a manutenção`; }
      if (ch && criarTarefa(tx, cid, 'Revisar IF', desc, csm, somaUteis(d, 2), 'Regra: HS abaixo de 60', ch)) evento(tx, cid, 'Tarefa automática', desc);
    }
    if (divergenciaHS(hs, c.hs_final) >= 2) notificarCoord(tx, 'Divergência de HS', `${nome}: HS de dados ${fnum(hs)} e HS final ${fnum(c.hs_final)}`, cid, `div:${cid}:${c.hs_data_calculo}:${c.if_atual}`);
    if (!c.prox_acao) notificar(tx, csm, 'Sem próxima ação', `${nome} está sem próxima ação agendada.`, cid, `semprox:${cid}:${iso(somaDias(d, -c.dias_sem_prox))}`);
    if (c.dias_sem_efetivo != null && c.dias_sem_efetivo >= DIAS_SEM_EFETIVO) notificar(tx, csm, 'Sem contato efetivo', `${nome}: ${c.dias_sem_efetivo} dias sem resposta do cliente.`, cid, `sce:${cid}:${c.ultimo_efetivo}`);
    if (c.sem_resposta && (c.prioridade_abc === 'A' || c.key_account)) notificarCoord(tx, 'Sem resposta', `${nome} (conta A ou Key Account) concluiu a régua sem resposta.`, cid, `semresp:${cid}:${c.ultimo_efetivo}`);
  });
  DB.descontos.forEach(ds => { const f = data(ds.fim); if (f && f >= d && f <= somaDias(d, 7)) { const c = obter('clientes', ds.id_cliente); if (c && (master || podeEditar(u, c))) notificar(tx, c.csm_ongoing, 'Fim de desconto', `Desconto de ${ds.pct}% termina em ${fdata(f)}.`, ds.id_cliente, `desc:${ds.id}`); } });
  tarefasSituacao().filter(t => t.situacao === 'Vencida' && (master || t.responsavel === u.nome)).forEach(t => notificar(tx, t.responsavel, 'Tarefa vencida', `${t.tipo}: ${t.descricao} (prazo ${fdata(t.prazo)})`, t.id_cliente, `venc:${t.id}`));
  return log;
}

// Executa uma operação: valida, aplica, envia e redesenha
async function executar(fn, sucesso) {
  const tx = new Tx();
  let r;
  try { r = fn(tx); } catch (e) {
    if (e instanceof ErroRegra) { DESFAZER(); throw e; }
    console.error(e); DESFAZER(); throw new ErroRegra('Erro inesperado: ' + e.message);
  }
  render();
  try { await tx.enviar(); } catch (e) {
    aviso('Não consegui salvar na planilha: ' + e.message + ' Recarregando os dados.', 'err');
    try { await carregarDados(); } catch (e2) { /* mantém */ }
    render(); return false;
  }
  if (sucesso !== false) aviso(sucesso || (typeof r === 'string' && r) || 'Alterações salvas.');
  return true;
}
// Em erro de validação, recarrega o estado salvo (demo) ou o último retrato do servidor
let RETRATO = null;
function tirarRetrato() { RETRATO = JSON.stringify(DB); }
function DESFAZER() { if (RETRATO) { const d = JSON.parse(RETRATO); Object.keys(d).forEach(t => (DB[t] = d[t])); VERSAO++; } }

// Janela com formulário. botoes: [{rotulo, pri, perigo, acao: dadosDoForm => msg}]
function janela(titulo, corpo, botoes = [], aoAbrir) {
  const dlg = $('#janela');
  $('#janelaTitulo').textContent = titulo;
  $('#janelaCorpo').innerHTML = `<div id="janelaErro"></div>${corpo}`;
  $('#janelaRodape').innerHTML = `<button class="btn" value="cancelar" type="submit" formnovalidate>Fechar</button>` +
    botoes.map((b, i) => `<button class="btn ${b.pri ? 'pri' : ''} ${b.perigo ? 'perigo' : ''}" type="button" data-bj="${i}">${esc(b.rotulo)}</button>`).join('');
  $$('#janelaRodape [data-bj]').forEach(btn => btn.onclick = async () => {
    const b = botoes[+btn.dataset.bj];
    tirarRetrato();
    btn.disabled = true;
    try {
      const ok = await executar(tx => b.acao(dadosForm($('#janelaForm')), tx), b.sucesso);
      if (ok !== false) dlg.close();
    } catch (e) {
      $('#janelaErro').innerHTML = `<div class="aviso a-err">${esc(e.message)}</div>`;
      $('#janelaCorpo').scrollTop = 0;
    } finally { btn.disabled = false; }
  });
  if (aoAbrir) aoAbrir($('#janelaCorpo'));
  if (!dlg.open) dlg.showModal();
}
function dadosForm(form) {
  const d = {};
  $$('[name]', form).forEach(el => {
    if (el.type === 'checkbox') { if (el.dataset.multi) { d[el.name] = d[el.name] || []; if (el.checked) d[el.name].push(el.value); } else d[el.name] = el.checked; }
    else if (el.type === 'radio') { if (el.checked) d[el.name] = el.value; }
    else if (el.multiple) d[el.name] = [...el.selectedOptions].map(o => o.value);
    else d[el.name] = el.value;
  });
  return d;
}

async function acaoPagina(fn, sucesso, errEl) {

  try { await executar(fn, sucesso); } catch (e) {
    if (errEl) errEl.innerHTML = `<div class="aviso a-err">${esc(e.message)}</div>`; else aviso(e.message, 'err');

}

const PADRAO_COLS = ['nome', 'if_atual', 'estado', 'hs_num', 'hs_final', 'faixa_at', 'modelo', 'csm', 'prox_acao', 'ultimo_efetivo', 'mrr'];
function valorOrdem(c, k) { const v = c[k]; if (v instanceof Date) return v.getTime(); if (typeof v === 'number') return v; if (v == null || v === '') return null; return String(v).toLowerCase(); }
function tabelaClientes(lista, cols = PADRAO_COLS, id = 't', selecao = null) {
  if (!lista.length) return vazio('Nenhum cliente com esses filtros.');
  const o = ESTADO_UI.ordem[id];
  if (o) lista = [...lista].sort((a, b) => { const x = valorOrdem(a, o.k), y = valorOrdem(b, o.k); if (x === y) return 0; if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : 1) * o.d; });
  const cb = c => selecao ? `<td><input type="checkbox" data-sel="${esc(c.id_cliente)}" ${selecao.has(c.id_cliente) ? 'checked' : ''} aria-label="Selecionar ${esc(c.nome)}"></td>` : '';
  return `<div class="tw"><table><thead><tr>${selecao ? '<th><input type="checkbox" data-seltodos aria-label="Selecionar todos"></th>' : ''}${cols.map(k => `<th data-ord="${id}|${k}" class="${COLS_CLIENTE[k][2] || ''}">${COLS_CLIENTE[k][0]}${o && o.k === k ? (o.d > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead><tbody>${lista.map(c => `<tr class="clica" data-cliente="${esc(c.id_cliente)}">${cb(c)}${cols.map(k => `<td class="${COLS_CLIENTE[k][2] || ''}">${COLS_CLIENTE[k][1](c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function tabelaSimples(linhas, cols) {
  if (!linhas.length) return vazio('Nada para mostrar.');
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${linhas.map(l => `<tr>${cols.map(c => `<td>${typeof c[1] === 'function' ? c[1](l) : esc(l[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function grafBarras(pares) {
  const max = Math.max(1, ...pares.map(p => p[1]));
  return `<div class="chart">${pares.map(([r, v]) => `<div class="l"><span>${esc(r)}</span><i style="width:${(v / max) * 100}%"></i><b class="num">${v}</b></div>`).join('')}</div>`;
}
function linhaSvg(pontos, alt = 120) {
  if (pontos.length < 2) return '';
  const w = 520, h = alt, pad = 24, xs = pontos.map(p => p[0].getTime()), min = Math.min(...xs), max = Math.max(...xs);
  const X = t => pad + ((t - min) / Math.max(1, max - min)) * (w - pad * 2), Y = v => h - pad - (v / 100) * (h - pad * 2);
  const d = pontos.map((p, i) => `${i ? 'L' : 'M'}${X(p[0].getTime()).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const faixas = [40, 60, 80].map(v => `<line x1="${pad}" x2="${w - pad}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)" stroke-dasharray="3 4"/><text x="${w - pad + 4}" y="${Y(v) + 4}" font-size="10" fill="var(--mut)">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px" role="img" aria-label="Histórico do HS de dados">${faixas}<path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2"/>${pontos.map(p => `<circle cx="${X(p[0].getTime())}" cy="${Y(p[1])}" r="3" fill="var(--ac)"><title>${fdata(p[0])}: ${p[1]}</title></circle>`).join('')}</svg>`;
}

  desenharMenu();
  const main = $('#conteudo');

  if (!permitido(pagina, u)) pagina = 'inicio';

  const rolagem = window.scrollY, mesmaPagina = main.dataset.pagina === pagina + '/' + arg;
  POS.length = 0;

  $$('[data-cliente]', raiz).forEach(el => el.addEventListener('click', e => { if (e.target.closest('button,a,input,select,textarea,summary')) return; ir('cliente', el.dataset.cliente); }));

  $$('th[data-ord]', raiz).forEach(th => th.addEventListener('click', () => {

}

function ligarAcessoUsuario() {
  const recarregar = async () => { try { await carregarDados(); } catch (e) { aviso(e.message, 'err'); } render(); };
  $('#verificar') && ($('#verificar').onclick = recarregar);
  if (!$('#acEnviar')) return;
  $$('[name=acTipo]').forEach(r => r.onchange = () => { $('#acCart').hidden = $('[name=acTipo]:checked').value !== 'CSM'; });
  $('#acEnviar').onclick = async () => {
    const nome = S($('#acNome').value), tipo = $('[name=acTipo]:checked').value;
    if (nome.length < 3) { $('#acErro').innerHTML = '<div class="aviso a-err">Informe seu nome completo.</div>'; return; }
    $('#acEnviar').disabled = true;
    try { await solicitarAcesso(tipo, $('[name=acCarteira]:checked').value, nome); await recarregar(); }
    catch (e) { $('#acErro').innerHTML = `<div class="aviso a-err">${esc(e.message)}</div>`; $('#acEnviar').disabled = false; }
  };
}

function garantirConfiguracao(tx) {
  if (!DB.listas.length) {
    const rows = [];
    Object.entries(LISTAS_PADRAO).forEach(([l, vs]) => vs.forEach(v => rows.push({ lista: l, valor: v, pai: '', ativo: 'Sim' })));
    Object.entries(MOTIVOS_RISCO).forEach(([m, ds]) => { rows.push({ lista: 'motivo_risco', valor: m, pai: '', ativo: 'Sim' }); ds.forEach(d => rows.push({ lista: 'detalhamento_risco', valor: d, pai: m, ativo: 'Sim' })); });
    tx.substituir('listas', rows);
  }
  if (!DB.cadencias.length) tx.substituir('cadencias', CADENCIAS_PADRAO.map(([modelo, estado, prioridade, dias]) => ({ modelo, estado, prioridade, dias })));
}

function janelaContato(cid, modo = 'completo') {
  const c = cliente(cid);
  const contatos = DB.contatos.filter(x => x.id_cliente === cid && x.ativo !== 'Não');
  const part = contatos.length ? `<div class="opcoes">${contatos.map(x => `<label><input type="checkbox" name="participantes" data-multi="1" value="${esc(x.nome)}">${esc(x.nome)}</label>`).join('')}</div>` : '<span class="mut peq">Sem contatos cadastrados</span>';
  const titulos = { completo: 'Registrar contato', rapido: 'Registro rápido de mensagem', checkin: 'Registrar check-in' };
  let corpo = `<div class="linha">${campo('Data', dt('data', hoje(), `max="${iso(hoje())}"`))}`;
  if (modo === 'rapido') corpo += `${campo('Canal', sel('canal', lista('canal')))}${campo('Por que registrar', sel('relevancia', lista('relevancia_registro_rapido')))}</div>`;
  else if (modo === 'checkin') corpo += `${campo('Canal', sel('canal', lista('canal'), 'Videochamada'))}</div>${campo('Participantes', part)}`;
  else corpo += `${campo('Tipo', sel('tipo', lista('tipo_interacao').filter(x => x !== 'Check-in')))}${campo('Canal', sel('canal', lista('canal')))}</div>${campo('Participantes', part)}`;
  corpo += `<div style="margin:12px 0">${campo('Resultado', radios('resultado', lista('resultado_contato'), lista('resultado_contato')[0]), 'Efetivo: o cliente respondeu ou interagiu. Sem resposta: houve envio ou tentativa.')}</div>`;
  if (modo === 'checkin') {
    corpo += `<p class="mut peq">Objetivos do cliente: ${esc(c.objetivos || 'ainda não registrados')}</p>` +
      ['Abertura|chk_abertura', 'Cenário atual|chk_cenario', 'Uso real da plataforma|chk_uso', 'Riscos percebidos|chk_riscos', 'Ação (obrigatório)|chk_acao']
        .map(x => { const [r, n] = x.split('|'); return `<div style="margin-bottom:8px">${campo(r, area(n))}</div>`; }).join('') +
      chk('confirmar', 'Confirmei os contatos e o sponsor com o cliente');
  } else {
    corpo += campo('Resumo do que foi tratado', area('resumo'));
    if (modo === 'completo') corpo += `<div style="margin-top:8px">${campo('Compromissos assumidos', area('compromissos'))}</div>`;
  }
  corpo += blocoProxima(cid, c.csm || USUARIO().nome);
  janela(`${titulos[modo]} · ${c.nome}`, corpo, [{
    rotulo: 'Salvar registro', pri: true, sucesso: 'Contato registrado com a próxima ação.',
    acao: (d, tx) => {
      const dados = { data: d.data, canal: d.canal, resultado: d.resultado, participantes: (d.participantes || []).join(', ') };
      if (modo === 'rapido') Object.assign(dados, { tipo: 'Mensagem', relevancia: d.relevancia, resumo: d.resumo });
      else if (modo === 'checkin') Object.assign(dados, { tipo: 'Check-in', chk_abertura: d.chk_abertura, chk_cenario: d.chk_cenario, chk_uso: d.chk_uso, chk_riscos: d.chk_riscos, chk_acao: d.chk_acao, resumo: d.chk_cenario });
      else Object.assign(dados, { tipo: d.tipo, resumo: d.resumo, compromissos: d.compromissos });
      return registrarInteracao(tx, cid, dados, lerProxima(d), !!d.confirmar);
    },
  }], raiz => ligarBlocoProxima(raiz));
}

function escolherCSM(id, todos = true) {
  const u = USUARIO();
  if (!ehMaster(u) && !ehVisitante(u) && u.carteira === 'Ongoing') return { csm: u.nome, html: '' };
  const csms = nomesCSM('Ongoing'), meu = csms.includes(u.nome) ? u.nome : csms[0] || '';
  let v = ESTADO_UI.filtros[id] ?? (todos ? '' : meu);
  if (!todos && !v) v = meu;
  depois(() => { $(`#${id}`).onchange = e => { ESTADO_UI.filtros[id] = e.target.value; render(); }; });
  return { csm: v || null, html: campo('CSM', `<select id="${id}">${opts(csms, v, todos ? 'Todos' : undefined)}</select>`) };
}
function pgPrioridades() {
  const u = USUARIO(), { csm, html } = escolherCSM('prioCsm', false);
  if (!csm) return `<h1>Prioridades da semana</h1>${vazio('Cadastre um CSM de Ongoing em Configurações.')}`;
  const sem = iso(segunda(hoje()));
  let lst = DB.lista_semanal.filter(l => l.csm === csm && l.semana === sem);
  const chaveG = csm + sem;
  const edita = u.nome === csm || ehMaster(u);
  if (edita && !lst.length && !ESTADO_UI['g' + chaveG]) { ESTADO_UI['g' + chaveG] = 1; depois(() => { tirarRetrato(); executar(tx => gerarLista(tx, csm), false); }); }
  const cart = new Map(carteira().map(c => [c.id_cliente, c]));
  lst = [...lst].sort((a, b) => (+a.posicao) - (+b.posicao));
  const pend = lst.filter(l => l.status === 'Pendente'), feitos = lst.filter(l => l.status !== 'Pendente');
  depois(() => {
    $('#regerar') && ($('#regerar').onclick = () => acaoPagina(tx => { gerarLista(tx, csm, true); }, 'Lista atualizada com a regra.'));
    $$('[data-tratar]').forEach(b => b.onclick = () => janelaContato(b.dataset.tratar, 'completo'));
    $$('[data-adiar]').forEach(b => b.onclick = () => {
      const it = obter('lista_semanal', b.dataset.adiar);
      janela(`Adiar ou dispensar · ${nomeCliente(it.id_cliente)}`, `${radios('status', [['Adiado', 'Adiar'], ['Dispensado', 'Dispensar']], 'Adiado')}<div class="linha" style="margin-top:12px">${campo('Motivo', sel('motivo', lista('motivo_adiamento')))}${campo('Detalhe', txt('det'))}</div>`,
        [{ rotulo: 'Confirmar', pri: true, acao: (d, tx) => adiarOuDispensar(tx, it.id, d.status, d.det ? `${d.motivo}: ${d.det}` : d.motivo), sucesso: 'Item atualizado.' }]);
    });

  const pct = lst.length ? (feitos.length / lst.length) * 100 : 0;
  return `<div class="topo"><div><h1>Prioridades da semana</h1><p class="lead">Semana de ${fdata(sem).slice(0, 5)}. A lista sai na segunda-feira, ordenada por risco antes do calendário; gatilhos imediatos entram no topo durante a semana.</p></div>
    <div class="acoes">${html ? `<div style="min-width:200px">${html}</div>` : ''}${edita ? '<button class="btn" id="regerar" type="button">Atualizar lista com a regra</button>' : ''}</div></div>
  <p class="peq mut">${feitos.length} de ${lst.length} itens tratados, adiados ou dispensados</p><div class="barra" style="margin-bottom:16px"><i style="width:${pct}%"></i></div>
  ${!lst.length ? vazio('Nenhum cliente em risco ou com cadência vencida nesta semana.') : ''}
  ${pend.map((it, i) => {
    const c = cart.get(it.id_cliente); if (!c) return '';
    const atras = data(it.prazo_reacao) < hoje();
    return `<details class="item"><summary><span class="pos">${it.posicao === '0' ? '▲' : i + 1}</span><div><div class="tit">${esc(c.nome)} <span class="mut" style="font-weight:400">— ${esc(it.motivo)}</span></div>

      <div class="corpo"><div class="grade g3 peq"><div><b>Estado:</b> ${esc(c.estado)}<br><b>Modelo:</b> ${esc(c.modelo)}</div><div><b>Último contato efetivo:</b> ${fdata(c.ultimo_efetivo)}<br><b>Dias sem contato efetivo:</b> ${fnum(c.dias_sem_efetivo)}</div><div><b>Próxima ação:</b> ${esc(c.prox_acao || '—')}<br><b>Prazo:</b> ${fdata(c.prox_prazo)}</div></div>

// ===================== carteira =====================
function filtrosCarteira(id) {
  const u = USUARIO(), temCart = TIPOS_CARTEIRA.includes(u.carteira) && !ehVisitante(u);
  const f = ESTADO_UI.filtros[id] || (ESTADO_UI.filtros[id] = { ver: temCart && !ehMaster(u) ? 'minha' : 'todos', status: 'Ativo', csm: '', jornada: '', modelo: '', if: '', estado: '', faixa: '', hs: '', prio: '', busca: '' });
  let cart = carteira();
  if (temCart && f.ver === 'minha') cart = cart.filter(c => c.csm_ongoing === u.nome || c.csm_onboarding === u.nome);
  if (f.csm) cart = cart.filter(c => c.csm === f.csm);
  if (f.status) cart = cart.filter(c => c.status === f.status);
  ['jornada', 'modelo', 'estado'].forEach(k => { if (f[k]) cart = cart.filter(c => c[k] === f[k]); });
  if (f.if) cart = cart.filter(c => c.if_atual === f.if);
  if (f.faixa) cart = cart.filter(c => String(c.faixa_at) === f.faixa);
  if (f.hs) cart = cart.filter(c => c.faixa_hsf === f.hs);
  if (f.prio) cart = cart.filter(c => c.prioridade_abc === f.prio);
  if (f.busca) { const b = f.busca.toLowerCase().replace(/[./-]/g, ''); cart = cart.filter(c => `${c.nome} ${c.razao_social} ${c.id_cliente} ${S(c.cnpj).replace(/\D/g, '')}`.toLowerCase().includes(b)); }
  const s = (k, vals, rot) => campo(rot, `<select data-f="${k}">${opts(vals, f[k], 'Todos')}</select>`);
  const html = `<div class="card filtros" style="margin-bottom:14px">
    ${campo('Buscar', `<input type="text" data-f="busca" value="${esc(f.busca)}" placeholder="Nome, CNPJ ou ID">`)}
    ${temCart ? campo('Clientes', `<select data-f="ver">${opts([['minha', 'Minha carteira'], ['todos', 'Todos']], f.ver)}</select>`) : s('csm', [...new Set(carteira().map(c => c.csm).filter(Boolean))].sort(), 'CSM')}
    ${campo('Situação', `<select data-f="status">${opts([['Ativo', 'Ativos'], ['Janela de reversão', 'Janela de reversão'], ['Cancelado', 'Cancelados']], f.status, 'Todos')}</select>`)}
    ${s('jornada', JORNADAS, 'Jornada')}${s('modelo', MODELOS, 'Modelo')}${s('if', IFS, 'IF')}${s('estado', ESTADOS, 'Estado')}
    ${s('faixa', ['1', '2', '3', '4', '5', '6', '7', '8'], 'Faixa')}${s('hs', ['Crítico', 'Atenção', 'Saudável', 'Excelente'], 'Faixa do HS final')}${s('prio', ['A', 'B', 'C'], 'Prioridade A/B/C')}</div>`;
  depois(() => $$('[data-f]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'change' : 'change', () => { f[el.dataset.f] = el.value; render(); })));
  return { cart, html };
}
function baixarCSV(nome, linhas) {
  if (!linhas.length) return;
  const cols = Object.keys(linhas[0]);
  const csv = [cols.join(';'), ...linhas.map(l => cols.map(c => `"${S(l[c]).replace(/"/g, '""')}"`).join(';'))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function pgCarteira() {
  const { cart, html } = filtrosCarteira('cart');
  const master = ehGestao(), selecao = ESTADO_UI.sel || (ESTADO_UI.sel = new Set());
  if (master) depois(() => {
    const atualizar = () => { $('#qtdSel').textContent = `${selecao.size} selecionado(s)`; };
    $$('[data-sel]').forEach(cb => cb.onchange = () => { cb.checked ? selecao.add(cb.dataset.sel) : selecao.delete(cb.dataset.sel); atualizar(); });
    $('[data-seltodos]') && ($('[data-seltodos]').onchange = e => { cart.forEach(c => e.target.checked ? selecao.add(c.id_cliente) : selecao.delete(c.id_cliente)); render(); });

  return `<div class="topo"><div><h1>${esc(c.nome)}</h1><div class="tags">${tags}</div>
    <p class="lead peq">CSM de Ongoing: <b>${esc(c.csm_ongoing || '—')}</b>${c.csm_onboarding ? ` · CSM de Onboarding: <b>${esc(c.csm_onboarding)}</b>` : ''} · CNPJ ${esc(fcnpj(c.cnpj) || '—')} · ID ${esc(c.id_cliente)}</p></div>${busca}</div>

    ${kpi('Próxima ação', c.prox_acao ? fdata(c.prox_prazo) : '—', c.prox_acao ? esc(c.prox_acao) : '<span class="tag t-red">Sem próxima ação</span>')}</div>

  <div><form class="card" id="formCrm" onsubmit="return false"><h3>Dados do CRM</h3>

    <div class="linha" style="margin-top:10px">${campo('Prioridade A/B/C', sel('prioridade_abc', [['', 'Sem prioridade'], 'A', 'B', 'C'], c.prioridade_abc, undefined, ['Consultivo', 'Key Account'].includes(c.modelo) && edita ? '' : 'disabled'), 'Só Faixa 3+. Até 10 contas A por CSM.')}
      ${campo('Faixa de atendimento', sel('faixa_atendimento', [['', 'Igual à faixa apurada'], ...'12345678'.split('')], c.faixa_atendimento, undefined, disG))}</div>
    <div class="linha">${campo('Jornada', sel('jornada', JORNADAS, c.jornada, undefined, disG))}${campo('CSM de Ongoing', sel('csm_ongoing', [['', 'Sem CSM'], ...csms], c.csm_ongoing, undefined, disG))}${campo('CSM de Onboarding', sel('csm_onboarding', [['', 'Sem CSM'], ...onbs], c.csm_onboarding, undefined, disG))}</div>
    ${chk('ka', 'Key Account por peso de marca', kaMarca, disG)}${campo('Justificativa do Key Account', txt('key_account_justificativa', c.key_account_justificativa, disG))}

function ligarGeral(c) {

// ---------- linha do tempo ----------
function fTempo(c) {
  const cats = ESTADO_UI.tlCats || ['interacao', 'evento', 'nota', 'marco'];
  const itens = [
    ...DB.interacoes.filter(i => i.id_cliente === c.id_cliente).map(i => ({ d: i.data, cat: 'interacao', tit: `${i.tipo} por ${i.canal} (${S(i.resultado).split(' (')[0].toLowerCase()})`, txt: [i.resumo, i.chk_acao && `Ação: ${i.chk_acao}`, i.compromissos && `Compromissos: ${i.compromissos}`, i.relevancia && `Relevância: ${i.relevancia}`, i.participantes && `Participantes: ${i.participantes}`].filter(Boolean), aut: i.registrado_por })),
    ...DB.eventos.filter(e => e.id_cliente === c.id_cliente).map(e => ({ d: e.data, cat: 'evento', tit: e.tipo, txt: [e.descricao], aut: e.usuario })),
    ...DB.notas.filter(n => n.id_cliente === c.id_cliente).map(n => ({ d: n.data, cat: n.tipo === 'Marco' ? 'marco' : 'nota', tit: n.tipo === 'Marco' ? `Marco: ${n.tipo_marco}` : 'Nota', txt: [n.texto], aut: n.autor })),
  ].filter(i => cats.includes(i.cat)).sort((a, b) => b.d.localeCompare(a.d)).slice(0, 200);
  const rot = { interacao: 'Interações', evento: 'Eventos', nota: 'Notas', marco: 'Marcos' };
  return `<div class="opcoes" style="margin-bottom:14px" id="tlCats">${Object.entries(rot).map(([k, r]) => `<label><input type="checkbox" value="${k}" ${cats.includes(k) ? 'checked' : ''}>${r}</label>`).join('')}</div>
  ${itens.length ? `<div class="tl">${itens.map(i => `<div class="ev ${i.cat}"><b>${esc(i.tit)}</b> <small class="mut">${fdh(i.d)} · ${esc(i.aut)}</small>${i.txt.map(t => `<div>${esc(t)}</div>`).join('')}</div>`).join('')}</div>` : vazio('Ainda não há registros para este cliente.')}`;
}
function ligarTempo() { $$('#tlCats input').forEach(i => i.onchange = () => { ESTADO_UI.tlCats = $$('#tlCats input:checked').map(x => x.value); render(); }); }

  ${ab.length ? tabelaSimples(ab, [['Prazo', t => `${fdata(t.prazo)}${t.situacao === 'Vencida' ? ' <span class="tag t-red">vencida</span>' : ''}`], ['Tarefa', t => `<b>${esc(t.tipo)}</b><br>${esc(t.descricao)}`], ['Responsável', 'responsavel'], ['Origem', 'origem'], ['', t => edita ? `<button class="btn peq" type="button" data-tarefa="${esc(t.id)}">Concluir ou alterar</button>` : '']]) : ''}

function ligarTarefasF(c) { $('#novaTarefa') && ($('#novaTarefa').onclick = () => janelaNovaTarefa(c.id_cliente)); $$('[data-tarefa]').forEach(b => b.onclick = () => janelaTarefa(b.dataset.tarefa)); }

// ---------- IF e saúde ----------
function fIF(c, edita) {
  const hs = DB.hs_historico.filter(h => h.id_cliente === c.id_cliente).map(h => [data(h.data), num(h.hs_dados)]).filter(p => p[0] && p[1] != null).sort((a, b) => a[0] - b[0]);
  const hist = DB.if_historico.filter(h => h.id_cliente === c.id_cliente).sort((a, b) => b.data.localeCompare(a.data));
  let form = '';
  if (!edita) form = '<p class="mut">Só o CSM responsável ou a coordenação alteram o IF.</p>';
  else if (c.if_atual === 'IF0') form = '<p class="mut">Cliente em IF0. Reativações na janela de reversão são tratadas pela coordenação.</p>';
  else if (sim(c.if_pendente)) form = '<div class="aviso a-info">Há uma classificação aguardando aprovação da coordenação.</div>';
  else form = `<button class="btn pri" id="alterarIF" type="button">Alterar IF</button><p class="mut peq">IF0 (cancelamento) é registrado na aba Retenção e churn.</p>`;
  const pIF3 = c.dias_if3 != null ? `<p class="peq">IF3 há ${c.dias_if3} dias ${c.dias_if3 >= IF3_LIMITE ? '(limite atingido)' : `(${IF3_LIMITE - c.dias_if3} para o limite)`}</p><div class="barra ${c.dias_if3 >= IF3_LIMITE ? 'critico' : c.dias_if3 >= IF3_ALERTA ? 'alerta' : ''}"><i style="width:${Math.min(100, c.dias_if3 / IF3_LIMITE * 100)}%"></i></div>` : '';
  return `<div class="grade g2"><div class="card"><h3>Situação atual</h3><p>${tagIF(c.if_atual)} desde ${fdata(c.if_desde)}</p>
    ${c.if_motivo ? `<p>Motivo do risco: <b>${esc(c.if_motivo)}</b> · ${esc(c.if_detalhamento)}</p>` : ''}${pIF3}
    ${c.excecao_validade ? `<p class="mut peq">Exceção de IF válida até ${fdata(c.excecao_validade)}.</p>` : ''}
    <h3 style="margin-top:14px">Histórico do HS de dados</h3>${hs.length > 1 ? linhaSvg(hs) : '<p class="mut">Sem histórico suficiente.</p>'}</div>
  <div class="card"><h3>Alterar IF</h3>${form}</div></div>
  <h2>Histórico de IF</h2>${tabelaSimples(hist, [['Quando', h => fdh(h.data)], ['De → para', h => `${esc(h.if_anterior || '—')} → <b>${esc(h.if_novo)}</b>`], ['Quem', 'usuario'], ['Justificativa', 'justificativa'], ['Evidência', 'evidencia'], ['Motivo', h => esc([h.motivo, h.detalhamento].filter(Boolean).join(' · '))], ['Origem', 'origem'], ['Situação', 'situacao']])}`;
}
function ligarIF(c) {
  $('#alterarIF') && ($('#alterarIF').onclick = () => {
    const opcoes = IFS.filter(i => i !== 'IF0' && (i !== c.if_atual || (i === 'IF3' && (c.dias_if3 || 0) >= IF3_LIMITE)));
    const ints = DB.interacoes.filter(i => i.id_cliente === c.id_cliente).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 5);
    const motivos = lista('motivo_risco');
    janela(`Alterar IF · ${c.nome}`, `${campo('Novo IF', sel('if_novo', opcoes.map(i => [i, `${i} · ${IF_NOME[i]}`]), '', 'Escolha o novo IF'))}
      <div id="ifRisco" hidden style="margin-top:10px"><div class="linha">${campo('Motivo do risco', sel('motivo', motivos, c.if_motivo, 'Escolha o motivo'))}${campo('Detalhamento', sel('detalhamento', lista('detalhamento_risco', c.if_motivo), c.if_detalhamento, 'Escolha o detalhamento'))}</div></div>
      <div id="ifCrit" hidden><p><b>Critérios de recuperação</b></p>${chk('x', `HS de dados de pelo menos 60 (atual: ${fnum(c.hs_num)})`, (c.hs_num || 0) >= HS_MIN_IF45, 'disabled')}${lista('criterio_recuperacao').map(k => `<label class="check"><input type="checkbox" name="criterios" data-multi="1" value="${esc(k)}"><span>${esc(k)}</span></label>`).join('')}</div>

      <div class="linha" style="margin-top:10px">${campo('Evidência', sel('ev_sel', [...ints.map(i => `Interação de ${fdata(i.data)}: ${i.tipo} — ${S(i.resumo).slice(0, 50)}`), 'Outra evidência']))}${campo('Descreva a evidência (se outra)', txt('ev_txt', '', 'placeholder="Ticket, dado ou conversa"'))}</div>`,
      [{ rotulo: 'Salvar novo IF', pri: true, acao: (d, tx) => {

        return r.msg;

        };
        $('[name=if_novo]', raiz).onchange = atual;
        $('[name=motivo]', raiz).onchange = e => { $('[name=detalhamento]', raiz).innerHTML = opts(lista('detalhamento_risco', e.target.value), '', 'Escolha o detalhamento'); };
      });
  });
}

// ---------- retenção e churn ----------
function fRet(c, edita) {
  const rets = DB.retencao.filter(r => r.id_cliente === c.id_cliente).sort((a, b) => b.aberto_em.localeCompare(a.aberto_em));
  const ab = rets.find(r => ['', 'Em negociação'].includes(r.desfecho));
  const churns = DB.churn.filter(x => x.id_cliente === c.id_cliente);
  let h = '';
  if (ab) {
    h += `<div class="card"><h3>Caso de retenção aberto (${esc(ab.gatilho)})</h3><p class="mut peq">Aberto em ${fdh(ab.aberto_em)}${ab.desfecho ? ` · desfecho atual: ${esc(ab.desfecho)}` : ''}</p>
      ${ab.causa ? `<p><b>Causa:</b> ${esc(ab.causa)}</p>` : ''}${ab.acoes ? `<p><b>Ações:</b> ${esc(ab.acoes)}</p>` : ''}
      ${ab.oferta_tipo ? `<p><b>Oferta:</b> ${esc(ab.oferta_tipo)}${ab.oferta_pct ? ` de ${esc(ab.oferta_pct)}% por ${esc(ab.oferta_meses)} meses` : ''} — ${esc(ab.oferta_situacao)}</p>` : ''}
      ${edita ? `<div class="acoes"><button class="btn pri" type="button" data-ret="plano|${esc(ab.id)}">Diagnóstico e plano</button><button class="btn" type="button" data-ret="oferta|${esc(ab.id)}">Registrar oferta</button><button class="btn" type="button" data-ret="desfecho|${esc(ab.id)}">Registrar desfecho</button></div>` : ''}</div>`;
  } else if (edita && c.status === 'Ativo') h += `<p class="mut">Nenhum caso de retenção aberto. IF1, IF2 e pedido de downgrade abrem um caso automaticamente.</p><div class="acoes" style="margin:0 0 10px"><button class="btn" type="button" id="abrirRet">Abrir caso de retenção manualmente</button></div>`;
  if (edita && c.status === 'Ativo') h += `<div class="acoes"><button class="btn" type="button" id="downgrade">Registrar pedido de downgrade</button><button class="btn perigo" type="button" id="cancelamento">Registrar cancelamento (IF0)</button></div>`;
  if (churns.length) h += `<h2>Cancelamentos</h2>${churns.map(x => `<div class="card" style="margin-bottom:8px">Cancelado em <b>${fdata(x.data_cancelamento)}</b> · MRR perdido ${fmoeda(x.mrr_perdido)} · churn surpresa: ${esc(x.churn_surpresa)} · origem: ${esc(x.origem || 'pendente')} · motivo: ${esc(x.motivo || 'pendente')}
    ${edita && !(x.origem && x.motivo) ? `<div class="acoes"><button class="btn pri peq" type="button" data-churn="${esc(x.id)}">Completar origem e motivo</button></div>` : ''}</div>`).join('')}`;
  const enc = rets.filter(r => r !== ab);
  if (enc.length) h += `<h2>Casos encerrados</h2>${tabelaSimples(enc, [['Aberto em', r => fdh(r.aberto_em)], ['Gatilho', 'gatilho'], ['Causa', 'causa'], ['Oferta', r => esc([r.oferta_tipo, r.oferta_pct && r.oferta_pct + '%'].filter(Boolean).join(' '))], ['Desfecho', 'desfecho'], ['Quem decidiu', 'decidido_por'], ['Base', 'base_decisao']])}`;
  return h;
}
function camposChurn() {
  return `<div class="linha">${campo('Data do cancelamento', dt('data_canc', hoje(), `max="${iso(hoje())}"`))}${campo('Origem do churn', sel('origem', lista('origem_churn')))}</div>
  <div class="linha">${campo('Motivo do churn', sel('motivo', lista('motivo_churn')))}${campo('Detalhamento', txt('det'))}</div>`;
}
function ligarRet(c) {
  const cid = c.id_cliente;
  $('#abrirRet') && ($('#abrirRet').onclick = () => acaoPagina(tx => { abrirRetencaoSePreciso(tx, cid, 'Manual', c.csm_ongoing, hoje()); }, 'Caso de retenção aberto.', $('#fichaErro')));

  const ok = async () => { localStorage.setItem('crmToken', $('#codigo').value.trim()); await iniciar(); };
  $('#entrar').onclick = ok; $('#codigo').onkeydown = e => { if (e.key === 'Enter') ok(); };
  $('#codigo').focus();
}
async function iniciar() {
  const tema = localStorage.getItem('crmTema'); if (tema) document.documentElement.dataset.theme = tema;
  if (!MODO_DEMO && !token()) return telaAcesso();
  $('#conteudo').innerHTML = '<div class="carregando">Carregando os dados…</div>';
  try { await carregarDados(); } catch (e) {
    if (/código de acesso/i.test(e.message)) { localStorage.removeItem('crmToken'); return telaAcesso(e.message); }
    $('#conteudo').innerHTML = `<div class="aviso a-err">${esc(e.message)}</div><div class="acoes"><button class="btn" onclick="location.reload()">Tentar de novo</button></div>`; return;
  }
  render();
  // Automações do dia (idempotentes: rodar em mais de um navegador não duplica nada)
  const u = USUARIO(), marca = `${iso(hoje())}|${u?.nome}`;
  if (u && DB.clientes.length && localStorage.getItem('crmAuto') !== marca) {
    tirarRetrato();
    try { if (await executar(tx => { if (!DB.listas.length || !DB.cadencias.length) garantirConfiguracao(tx); executarAutomacoes(tx); }, false)) localStorage.setItem('crmAuto', marca); } catch (e) { console.warn(e); }
    render();
  }
}
